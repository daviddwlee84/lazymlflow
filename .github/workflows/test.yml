name: Test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test source and module packaging guards
        if: hashFiles('scripts/check-distribution.py') != ''
        run: python3 -m unittest discover -s scripts -p test_distribution.py
      - name: Build independently extracted source and Go module distributions
        if: hashFiles('scripts/check-distribution.py') != ''
        run: python3 scripts/check-distribution.py
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/lazymlflow ./cmd/lazymlflow
      - run: python3 scripts/pty_smoke.py --binary ./bin/lazymlflow
      - run: python3 scripts/pty_inspection.py --binary ./bin/lazymlflow
      - if: hashFiles('scripts/pty_setup_models.py') != ''
        run: python3 scripts/pty_setup_models.py --binary ./bin/lazymlflow
  mlflow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mlflow: ['2.22.0', '3.12.0', '3.16.1']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
      - run: go build -o bin/lazymlflow ./cmd/lazymlflow
      - run: uv run --no-project --python 3.12 --with 'mlflow==${{ matrix.mlflow }}' python scripts/integration_mlflow.py
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
      - run: go build -o bin/lazymlflow ./cmd/lazymlflow
      - run: uv run --no-project --python 3.12 --with mlflow==3.16.1 --with boto3 python scripts/integration_s3.py

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test release verification and immutable publication
        run: python3 -m unittest discover -s scripts -p "test_*release*.py"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - name: Verify four platform archives and native startup
        run: python3 scripts/release.py check --project lazymlflow --binary lazymlflow --smoke
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
      - run: go build -o bin/lazymlflow ./cmd/lazymlflow
      - if: hashFiles('scripts/integration_models.py') != ''
        run: uv run --no-project --python 3.12 --with mlflow==3.16.1 python scripts/integration_models.py
      - if: hashFiles('scripts/serving_feasibility.py') != ''
        run: uv run --no-project --python 3.12 scripts/serving_feasibility.py --json
  servers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [sqlite, auth, pg-auth, postgres, rustfs, seaweedfs, external-s3, provided]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/lazymlflow ./cmd/lazymlflow
      - if: hashFiles('scripts/integration_server.py') != ''
        run: python3 scripts/integration_server.py --binary ./bin/lazymlflow --profiles "${{ matrix.profile }}"
