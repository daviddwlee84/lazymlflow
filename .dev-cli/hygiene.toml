version = 1
secrets = "block"
known = "block"
generic = "warn"

# Exact, reviewed non-production values. Audit scans intentionally report them.
[[exceptions]]
rule = "generic-password-assignment-single-quoted"
path = "internal/server/templates/runtime.py"
pattern = '^POSTGRES_PASSWORD$'
reason = "Environment-variable name in the secret lookup map; the password value is read from os.environ at runtime."

[[exceptions]]
rule = "generic-password-assignment-single-quoted"
path = "internal/server/templates/runtime.py"
pattern = '^LAZYMLFLOW_BOOTSTRAP_PASSWORD$'
reason = "Environment-variable name in the secret lookup map; the bootstrap password value is read from os.environ at runtime."

[[exceptions]]
rule = "generic-password-assignment"
path = "internal/connection/ssh_test.go"
pattern = '^selected-password$'
reason = "Synthetic Basic-auth fixture for an isolated httptest upstream and loopback proxy; no external service authentication."

[[exceptions]]
rule = "generic-password-assignment"
path = "scripts/integration_s3.py"
pattern = '^lazymlflow-test-secret$'
reason = "Synthetic credential shared by disposable loopback MinIO and its integration client, with temporary storage and explicit teardown."

[[exceptions]]
rule = "generic-password-assignment"
path = "internal/server/stack.go"
pattern = '^\ \+\ string\(secrets\[$'
reason = "Go expression concatenating runtime-generated secret bytes; no credential literal."

[[exceptions]]
rule = "generic-password-assignment"
path = "internal/server/manager_test.go"
pattern = '^\ \+\ string\(secret\)\ \+\ $'
reason = "Go expression concatenating a fresh temporary fixture secret to test log redaction."

[[exceptions]]
rule = "generic-api-key"
path = "internal/server/spec.go"
pattern = '^s\.S3SecretKeyEnv$'
reason = "Go field identifier in a multi-assignment of environment-variable names."

[[exceptions]]
rule = "generic-password-assignment"
path = "internal/connection/clientenv_test.go"
pattern = '^\}\);\ err\ ==\ nil\ \|\|\ !strings\.Contains\(err\.Error\(\),\ $'
reason = "Go control-flow expression following an intentionally empty environment-variable test case."
